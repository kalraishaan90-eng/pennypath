<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" rx="100" fill="#0F414A"/>
  
  <!-- Outer border shadow of winding path -->
  <path d="M 90 440 C 160 360, 340 320, 390 110" 
        fill="none" 
        stroke="#0A2D33" 
        stroke-width="60" 
        stroke-linecap="round"/>
        
  <!-- Paper Winding Path -->
  <path d="M 90 440 C 160 360, 340 320, 390 110" 
        fill="none" 
        stroke="#EFE8DF" 
        stroke-width="52" 
        stroke-linecap="round"/>
        
  <!-- Center dashed line -->
  <path d="M 90 440 C 160 360, 340 320, 390 110" 
        fill="none" 
        stroke="#D8BA98" 
        stroke-width="4" 
        stroke-dasharray="14 14" 
        stroke-linecap="round"/>

  <!-- Penny Shadow -->
  <circle cx="270" cy="286" r="64" fill="rgba(8, 35, 40, 0.4)"/>

  <!-- Penny Outer Bronze Rim -->
  <circle cx="266" cy="280" r="64" fill="#9E7B54"/>
  
  <!-- Penny Golden Face -->
  <circle cx="266" cy="280" r="59" fill="#D8BA98"/>
  <circle cx="266" cy="279" r="55" fill="none" stroke="#F0DCBE" stroke-width="2"/>

  <!-- Rupee Symbol on Coin -->
  <text x="266" y="302" 
        font-family="'Fraunces', serif" 
        font-size="64" 
        font-weight="bold" 
        text-anchor="middle" 
        fill="#0F414A">₹</text>
</svg>
